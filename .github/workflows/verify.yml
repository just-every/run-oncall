name: Verify
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'
jobs:
  lanes:
    if: github.event_name != 'workflow_dispatch'
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: runtime
            browser: false
          - lane: activation
            browser: false
          - lane: triage
            browser: false
          - lane: changes
            browser: false
          - lane: intake
            browser: false
          - lane: reviews
            browser: false
          - lane: adoption-demo
            browser: false
          - lane: signin
            browser: true
          - lane: product-browser
            browser: true
          - lane: hosted
            browser: true
    env:
      ONCALL_VERIFY_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v4
      - name: Free unused runner SDKs for the 15 GiB disk guard
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h / /tmp
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - if: matrix.browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify the selected public-door journey
        env:
          ONCALL_BROWSER_EVIDENCE: ${{ runner.temp }}/oncall-browser-evidence
        run: |
          if [ "$ONCALL_VERIFY_LANE" = hosted ]; then
            pnpm exec rer verify --non-interactive
          else
            node tests/verify.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always() && matrix.browser
        with:
          name: oncall-browser-evidence-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/oncall-browser-evidence
            evidence/browser
  installation:
    name: ${{ matrix.lane }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: managed-browser
            browser: true
          - lane: transfer
            browser: false
    env:
      ONCALL_VERIFY_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v4
      - name: Free unused runner SDKs for the 15 GiB disk guard
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h / /tmp
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - if: matrix.browser
        run: pnpm exec playwright install --with-deps chromium
      - run: node tests/verify.mjs
        env:
          ONCALL_BROWSER_EVIDENCE: ${{ runner.temp }}/oncall-browser-evidence
      - uses: actions/upload-artifact@v4
        if: always() && matrix.browser
        with:
          name: oncall-browser-evidence-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/oncall-browser-evidence
            evidence/browser
  verify:
    # Preserve the required check name while waiting for every applicable lane.
    if: always()
    needs: [lanes, installation]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every verification lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          LANES_RESULT: ${{ needs.lanes.result }}
          INSTALLATION_RESULT: ${{ needs.installation.result }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$LANES_RESULT" = skipped
            test "$INSTALLATION_RESULT" = success
          else
            test "$LANES_RESULT" = success
            case "$INSTALLATION_RESULT" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          fi
